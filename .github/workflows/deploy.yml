# Tests the site and publishes it to GitHub Pages on every push to main.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
name: Test and deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: python build.py
      - run: node --test tests/eqcore.test.js
      - run: |
          pip install pytest playwright
          python -m playwright install --with-deps chromium
          cd tests && npm install && cd ..
          CHROME_PATH=$(python -c "from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()") python -m pytest -q tests/test_browser.py
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python build.py --base "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: d
        uses: actions/deploy-pages@v4
